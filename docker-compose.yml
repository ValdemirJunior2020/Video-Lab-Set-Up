x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo
services:
  scene-planner:
    build:
      context: .
      dockerfile: scene_planner_service/Dockerfile
    container_name: moneyprinterturbo-scene-planner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen3:8b
      SCENE_AGENT_RETRIES: "3"
    ports:
      - "127.0.0.1:4130:4130"
    restart: unless-stopped

  chatterbox:
    build:
      context: .
      dockerfile: chatterbox_service/Dockerfile
    container_name: moneyprinterturbo-chatterbox
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      - chatterbox-models:/models
      - ./reference_audio:/reference_audio
    ports:
      - "127.0.0.1:4123:4123"
    restart: unless-stopped

  webui:
    depends_on:
      - chatterbox
      - scene-planner
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneyprinterturbo-webui
    ports:
      - "127.0.0.1:8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    command: ["streamlit","run","./webui/Main.py","--server.address=0.0.0.0","--server.port=8501","--browser.serverAddress=127.0.0.1","--server.enableCORS=True","--browser.gatherUsageStats=False","--client.toolbarMode=minimal","--logger.hideWelcomeMessage=True","--server.showEmailPrompt=False"]
    volumes: *common-volumes
    restart: unless-stopped
  api:
    depends_on:
      - chatterbox
      - scene-planner
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneyprinterturbo-api
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    command: ["python3","main.py"]
    volumes: *common-volumes
    restart: unless-stopped

volumes:
  chatterbox-models:
